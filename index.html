<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Politécnico Superior Crea. Cursos de formación en organización de eventos y Excel."
  >

  <title>Politécnico Superior Crea</title>

  <style>
    :root {
      --azul: #08264b;
      --azul-oscuro: #041a35;
      --dorado: #e8b64f;
      --dorado-claro: #ffda83;
      --blanco: #ffffff;
      --fondo: #f4f6fa;
      --texto: #182b45;
      --gris: #5b6879;
      --borde: #e1e5ed;
      --verde-whatsapp: #25d366;
    }

    * {
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--texto);
      line-height: 1.7;
      background: var(--blanco);
    }

    h1,
    h2,
    h3 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: bold;
      line-height: 1.3;
    }

    h1 {
      font-size: 2.5rem;
      letter-spacing: 1px;
    }

    h2 {
      font-size: 2rem;
    }

    h3 {
      font-size: 1.4rem;
    }

    a {
      color: var(--azul);
    }

    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid var(--dorado);
      outline-offset: 3px;
    }

    header {
      background: var(--azul-oscuro);
      color: var(--blanco);
      padding: 15px 6%;
      border-bottom: 4px solid var(--dorado);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
    }

    .marca {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .marca img {
      width: 65px;
      height: 65px;
      object-fit: contain;
    }

    .marca h2 {
      margin: 0;
      color: var(--blanco);
      font-size: 17px;
      line-height: 1.2;
    }

    .marca span {
      display: block;
      color: var(--dorado);
      font-size: 30px;
      letter-spacing: 4px;
    }

    nav {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 18px;
    }

    nav a {
      color: var(--blanco);
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: var(--dorado);
    }

    .hero {
      background:
        linear-gradient(120deg, rgba(4, 26, 53, 0.97), rgba(8, 38, 75, 0.94)),
        url("psc1.png") center / cover;
      color: var(--blanco);
      padding: 80px 8%;
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(32px, 5vw, 52px);
      line-height: 1.15;
      margin: 10px auto 20px;
      max-width: 850px;
    }

    .hero h1 span {
      color: var(--dorado);
    }

    .hero p {
      max-width: 680px;
      margin: 0 auto 28px;
      font-size: 18px;
    }

    .boton {
      display: inline-block;
      background: var(--dorado);
      color: var(--azul-oscuro);
      padding: 13px 23px;
      border: none;
      border-radius: 7px;
      font-family: inherit;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .boton:hover {
      background: var(--dorado-claro);
      transform: translateY(-2px);
    }

    section {
      padding: 55px 7%;
    }

    .titulo {
      color: var(--azul);
      font-size: 32px;
      margin-top: 0;
      margin-bottom: 8px;
    }

    .subtitulo {
      color: var(--gris);
      margin-top: 0;
      margin-bottom: 30px;
    }

    /* Estilos del contenedor de video con fondo blanco */
    .video-contenedor {
      position: relative;
      padding-bottom: 56.25%; /* Relación de aspecto 16:9 estándar */
      height: 0;
      overflow: hidden;
      max-width: 800px;
      margin: 0 auto;
      border-radius: 12px;
      box-shadow: 0 5px 16px rgba(8, 38, 75, 0.15);
      border: 1px solid var(--borde);
      background: #ffffff; /* Fondo blanco para las pestañas/bordes del reproductor */
    }

    .video-contenedor video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      object-fit: contain; /* Muestra el video completo sin recortes */
    }

    .cursos {
      background: var(--fondo);
    }

    .rejilla {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 25px;
    }

    .tarjeta {
      background: var(--blanco);
      border-radius: 12px;
      border: 1px solid var(--borde);
      box-shadow: 0 5px 16px rgba(8, 38, 75, 0.08);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .tarjeta:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 24px rgba(8, 38, 75, 0.16);
    }

    .tarjeta-cabecera {
      position: relative;
      height: 195px;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      padding: 20px;
    }

    .tarjeta-cabecera::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        to bottom,
        rgba(4, 26, 53, 0.15) 0%,
        rgba(4, 26, 53, 0.88) 100%
      );
      z-index: 1;
    }

    .bg-eventos {
      background-image: url("https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&w=1600&q=85");
    }

    .bg-eventos-petit {
      background-image: url("https://images.unsplash.com/photo-1530103862676-de8c9debad1d?auto=format&fit=crop&w=1600&q=85");
    }

    .bg-excel {
      background-image: url("https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1600&q=85");
    }

    .tarjeta-cabecera h3 {
      position: relative;
      z-index: 2;
      color: var(--blanco);
      margin: 0;
      font-size: 20px;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.6);
    }

    .tarjeta-contenido {
      padding: 22px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .tarjeta-contenido p {
      margin-top: 0;
      margin-bottom: 18px;
      color: var(--texto);
    }

    .tarjeta a {
      font-weight: bold;
      text-decoration: none;
      color: var(--azul);
    }

    .tarjeta a:hover {
      text-decoration: underline;
    }

    .etiqueta {
      display: inline-block;
      padding: 5px 12px;
      background: #fff2d0;
      color: #684b00;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 15px;
      align-self: flex-start;
    }

    .nosotros {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 35px;
      align-items: center;
    }

    .panel {
      background: var(--azul);
      color: var(--blanco);
      padding: 28px;
      border-left: 5px solid var(--dorado);
      border-radius: 12px;
    }

    .panel h3 {
      color: var(--dorado);
    }

    .aliados-seccion {
      background: var(--blanco);
      text-align: center;
    }

    .contenedor-aliados {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .tarjeta-aliado {
      background: var(--fondo);
      border: 1px solid var(--borde);
      border-radius: 10px;
      padding: 25px 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(8, 38, 75, 0.04);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .tarjeta-aliado:hover {
      transform: translateY(-3px);
      border-color: var(--dorado);
    }

    .nombre-aliado {
      font-size: 18px;
      font-weight: bold;
      color: var(--azul);
      letter-spacing: 0.5px;
    }

    .inscripcion {
      background: var(--azul-oscuro);
      color: var(--blanco);
    }

    .inscripcion .titulo {
      color: var(--blanco);
    }

    .formulario-contenido {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 35px;
      align-items: start;
    }

    form {
      background: var(--blanco);
      color: var(--texto);
      padding: 28px;
      border-radius: 12px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      margin-bottom: 17px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-family: inherit;
      font-size: 16px;
    }

    input:focus,
    select:focus {
      border-color: var(--azul);
      outline: 2px solid rgba(8, 38, 75, 0.15);
    }

    .aceptacion {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      font-size: 13px;
      font-weight: normal;
      margin-bottom: 18px;
    }

    .aceptacion input {
      width: auto;
      margin-top: 5px;
    }

    form .boton {
      width: 100%;
    }

    #mensaje {
      color: #8a4b00;
      font-weight: bold;
      min-height: 24px;
    }

    .redes-seccion {
      background: var(--fondo);
      text-align: center;
    }

    .contenedor-redes {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .boton-social {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--azul);
      color: var(--blanco);
      padding: 12px 24px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 4px 12px rgba(8, 38, 75, 0.12);
      transition: all 0.3s ease;
    }

    .boton-social:hover {
      background: var(--dorado);
      color: var(--azul-oscuro);
      transform: translateY(-2px);
    }

    .boton-social svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    footer {
      background: #031326;
      color: var(--blanco);
      text-align: center;
      padding: 30px 20px;
    }

    footer strong {
      color: var(--dorado);
    }

    footer a {
      color: var(--dorado);
      font-weight: bold;
    }

    .whatsapp-flotante {
      position: fixed;
      right: 20px;
      bottom: 20px;
